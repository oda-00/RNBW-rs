[package]
name = "rnbw"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Lane-implied 4-ary trie codec and performance benchmarks"
license = "MIT OR Apache-2.0"

[dependencies]
arrayvec = "=0.7.8"
rayon = "=1.12.0"
wgpu = { version = "30.0.1", optional = true }

[dev-dependencies]
brotli = "=9.1.1"
criterion = "=0.8.2"
flate2 = "=1.1.11"
lz4_flex = "=0.14.0"
roaring = "=0.11.5"
snap = "=1.1.2"
zstd = "=0.14.3"

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "trnmap"
harness = false

[[bench]]
name = "store"
harness = false

[[bench]]
name = "files"
harness = false

[[bench]]
name = "gpu"
harness = false
required-features = ["wgpu"]

[[bin]]
name = "rnbw"
path = "src/main.rs"

[profile.bench]
debug = true

[features]
wgpu = ["dep:wgpu"]

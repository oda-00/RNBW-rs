[package]
name = "rnbw"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Lane-implied 4-ary trie codec and performance benchmarks"
license = "MIT OR Apache-2.0"

[dependencies]
lz4_flex = "=0.14.0"
roaring = "=0.11.5"

[dev-dependencies]
criterion = "=0.8.2"

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "trnmap"
harness = false

[[bin]]
name = "rnbw"
path = "src/main.rs"

[profile.bench]
debug = true
